<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b37"><title>借火 · 余火之路</title><link rel="stylesheet" href="style.css?v=3.0.2"></head><body><main><header><a href="../">小游戏实验室</a><div><button id="sound" aria-pressed="false">声音：关</button><button id="motion">震屏：开</button><button id="pause">暂停</button></div></header><section class="title"><div><h1>借火<span>把子弹还给它。</span></h1></div><p id="best">最佳 0</p></section><section class="game" aria-label="借火游戏区域"><canvas id="game" width="480" height="640" tabindex="0" aria-label="方向键或WASD移动，按住空格吸收子弹，松开反击。触屏左侧摇杆移动，右侧按钮吸放。"></canvas><div class="hud"><div><small id="buildLabel">蜂群 · 强化 1</small><small id="wave">第 1 / 5 波</small><strong id="score">0</strong></div><div class="right"><span id="hearts">● ● ●</span><small id="status">准备接火</small></div></div><div id="overlay" class="overlay"><div class="card" id="card"></div></div><div class="meter"><div><span id="capacity">蓄弹 0</span><span id="heatText">护盾温度</span></div><div class="track"><i id="heat"></i></div></div></section><div id="touchControls" class="touch-controls" hidden><div id="joystick" role="application" aria-label="左侧虚拟摇杆">移动<span></span></div><button id="fire" aria-label="按住吸收松手反击">按住吸火<br><small>松手反击</small></button></div><footer><b>按住吸弹 · 松手反击</b><span>鼠标拖动 / WASD + 空格　·　P 暂停</span></footer></main><script type="module" src="game.js?v=3.0.3"></script></body></html>
