<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b37"><title>借火 · 像素流派版</title><link rel="stylesheet" href="style.css?v=2.1"></head><body><main><header><a href="../">小游戏实验室</a><div><button id="sound" aria-pressed="false">声音：关</button><button id="pause">暂停</button></div></header><section class="title"><div><span class="eyebrow">BORROWED FIRE</span><h1>借火<span>把子弹还给它。</span></h1></div><p id="best">最佳 0</p></section><section class="game" aria-label="借火游戏区域"><canvas id="game" width="480" height="640" tabindex="0" aria-label="方向键或WASD移动，按住空格吸收子弹，松开反击。也可按住拖动鼠标或手指。"></canvas><div class="hud"><div><small id="buildLabel">蜂群 · 强化 1</small><small id="wave">第 1 / 5 波</small><strong id="score">0</strong></div><div class="right"><span id="hearts">● ● ●</span><small id="status">准备接火</small></div></div><div id="overlay" class="overlay"><div class="card" id="card"></div></div><div class="meter"><div><span id="capacity">蓄弹 0</span><span id="heatText">护盾温度</span></div><div class="track"><i id="heat"></i></div></div></section><footer><b>按住吸弹 · 松手反击</b><span>拖动移动 / WASD + 空格　·　P 暂停</span></footer></main><script type="module" src="game.js?v=2.1"></script></body></html>
