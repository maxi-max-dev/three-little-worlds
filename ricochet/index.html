<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161634"><meta name="description" content="瞄准、弹射、引爆连锁。"><title>一击连锁 · 试玩</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="top"><div><div class="eyebrow"><span class="spark">✦</span> 小小游乐场 <span class="divider">/</span> 玩法实验</div><h1>一击<span>连锁</span><i>。</i></h1></div><button id="sound" class="icon-button" aria-label="关闭音效" aria-pressed="true" title="音效开关">♫ <span>音效开</span></button></header>
<section class="layout"><div class="game-column"><div class="stats"><div><small>剩余弹珠</small><strong id="shots">06</strong><span class="unit">发</span></div><div class="score-block"><small>本局得分</small><strong id="score">0</strong></div><div class="targets"><small>目标</small><strong><span id="cleared">0</span><span class="slash"> / </span><span id="total">24</span></strong></div></div>
<div class="board-shell" id="boardShell"><canvas id="board" width="720" height="850" aria-label="弹射连锁游戏区域，拖动瞄准后松开发射，也可使用方向键和空格操作" tabindex="0"></canvas><div class="board-label"><span class="live-dot"></span> CHAIN REACTION <span class="board-no">● ● ●</span></div><div class="aim-hint" id="hint">按住场地瞄准 <span>·</span> 松开发射</div><div class="result hidden" id="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-card"><div class="result-eyebrow" id="resultTag">THIS ROUND</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-score"><small>本局得分</small><strong id="finalScore">0</strong></div><button class="primary" id="retry">再来一次 <span>↗</span></button><button class="text-button" id="newLayout">换个布局</button></div></div></div>
<div class="bottom-bar"><div><span class="tiny-star">✳</span> <span id="status">瞄准橙色光点，触发附近的连锁</span></div><button class="text-button" id="reset">重试本局 ↺</button></div></div>
<aside class="side"><div class="side-head"><span class="side-icon">✳</span><p>一发，<br><em>看看能点亮多少。</em></p></div><div class="rule"><span class="rule-num">01</span><div><b>瞄准发射</b><p>按住场地调整方向，松开发射。弹珠会在边界反弹。</p></div></div><div class="rule"><span class="rule-num">02</span><div><b>引爆连锁</b><p>击中光点，附近的光点会接连绽放。✦ 星点的连锁范围更大。</p></div></div><div class="rule"><span class="rule-num">03</span><div><b>清空场地</b><p>6 发之内点亮所有光点。重试时布局不变，可以换个角度。</p></div></div><div class="side-foot"><span>✦</span><p>键盘：← → 调整方向，空格发射。<br>声音可在右上角关闭。</p></div><a href="../" class="back">← 返回三个小世界</a></aside></section></main><script type="module" src="game.js"></script></body></html>
